###############################################################
### to enable M117
[display_status]

### to enable M118
[respond]
default_type: command
###default_type: echo
###default_prefix:

########################              DOESN'T WORK WELL....    ORCASLICER START PRINT MACHINE GCODE   ########################
### ;start_gcode
### M109 S[nozzle_temperature_initial_layer] T[initial_extruder]
### START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer] EXTRUDER=[initial_extruder] TOTAL_LAYER=[total_layer_count] MAX_VOL_SPEED={filament_max_volumetric_speed[initial_no_support_extruder]}
### ;start_gcode end

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(0)|int %}
    {% set TOTAL_LAYER = params.TOTAL_LAYER|default(1)|int %}
    {% set MAX_VOL_SPEED = params.MAX_VOL_SPEED|default(300)|float %}

    M118 START_PRINT: chiamata ricevuta
    M118 START_PRINT: BED_TEMP={BED_TEMP} EXTRUDER_TEMP={EXTRUDER_TEMP} EXTRUDER={EXTRUDER} TOTAL_LAYER={TOTAL_LAYER} MAX_VOL_SPEED={MAX_VOL_SPEED}

    M118 START_PRINT: set bed temp
    M140 S{BED_TEMP}

    M118 START_PRINT: fan setup
    M106 P101 S0 ; L+R_PLA_Turbo_Fan_0-255
    M106 P2 S0   ; Center_Fresh_Air_Input_Fan
    M106 S0      ; Model_Fan
    M106 P3 S0   ; Filter_Unit_Fan

    M118 START_PRINT: G90/M83
    G90
    M83

    M118 START_PRINT: lift Z
    G1 Z5 F2400

    M118 START_PRINT: set total layer
    SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYER}

    M118 START_PRINT: carico mesh temperatura
    CARICA_MESH_TEMPERATURA
    M118 START_PRINT: mesh temperatura caricata

    M118 START_PRINT: seleziono tool T{EXTRUDER}

    {% set extruderstr = "extruder" if EXTRUDER|int == 0 else "extruder" ~ (EXTRUDER|int) %}

    ###ACTIVATE_EXTRUDER EXTRUDER={extruderstr}

    M118 START_PRINT: tool T{EXTRUDER} selezionato
    M118 START_PRINT: tool EXTRUDER NAME={extruderstr}
    M118 START_PRINT: attendo temperatura estrusore {EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP} T{EXTRUDER}
    M118 START_PRINT: temperatura raggiunta

    M118 START_PRINT: posizionamento purge line
    G1 X256 Y0 Z0.2 F6000
    G1 E5 F{MAX_VOL_SPEED / 2.4053 * 60}
    G1 X216 E10 F{MAX_VOL_SPEED / 2.4053 * 60}

    M118 START_PRINT: fine start print

##########################################################

[gcode_macro END_PRINT]
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91
    G1 E-1.2 Z{z_safe} F3000
    G90
    G1 X150 Y150 F12000
    UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10
##########################################################

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: REAL_BED_MESH_CALIBRATE
gcode:
    M118 Intercettato comando Flashforge: livellamento ignorato. Uso mesh pre-salvata.

##########################################################

[gcode_macro CARICA_MESH_TEMPERATURA]
gcode:
    {% set BED_TEMP = params.BED|default(printer.heater_bed.target)|float %}

    {% if BED_TEMP >= 110 %}
        {% set MESH_TARGET = "110" %}
    {% elif BED_TEMP >= 100 %}
        {% set MESH_TARGET = "100" %}
    {% elif BED_TEMP >= 90 %}
        {% set MESH_TARGET = "90" %}
    {% elif BED_TEMP >= 80 %}
        {% set MESH_TARGET = "80" %}
    {% elif BED_TEMP >= 70 %}
        {% set MESH_TARGET = "70" %}
    {% elif BED_TEMP >= 60 %}
        {% set MESH_TARGET = "60" %}
    {% elif BED_TEMP >= 50 %}
        {% set MESH_TARGET = "50" %}
    {% else %}
        {% set MESH_TARGET = "40" %}
    {% endif %}

    {% set SALVATI = printer.bed_mesh.profiles %}

    {% if MESH_TARGET in SALVATI %}
        M118 Caricamento mesh salvata per profilo {MESH_TARGET} (Target: {BED_TEMP}C)
        BED_MESH_PROFILE LOAD={MESH_TARGET}
    {% else %}
        M118 ====================================================
        M118 !!! MESH {MESH_TARGET} NON PRESENTE SU DISCO !!!
        M118 Annullamento stampa e avvio calibrazione automatica...
        M118 ====================================================

        CANCEL_PRINT
        M140 S{BED_TEMP}
        DEPOSITA_TOOL
        SALVA_MESH_TEMPERATURA B={BED_TEMP|int}
        DISABILITA_MOTORI
    {% endif %}

##########################################################

[gcode_macro SALVA_MESH_TEMPERATURA]
description: Verifica la sicurezza degli utensili e avvia la calibrazione della mesh
gcode:
    _VERIFICA_E_ESECUZIONE_MESH {rawparams}

##########################################################

[gcode_macro _VERIFICA_E_ESECUZIONE_MESH]
gcode:
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}

    {% set pos = [
        printer["gcode_button extruder_pos1"].state,
        printer["gcode_button extruder_pos2"].state,
        printer["gcode_button extruder_pos3"].state,
        printer["gcode_button extruder_pos4"].state
    ] %}

    {% set ns = namespace(mounted=[], missing=[], ok_count=0) %}

    {% for i in range(4) %}
        {% set tool_num = i + 1 %}
        {% set p = pos[i] %}
        {% set g = grab[i] %}

        {% if p == "PRESSED" and g == "RELEASED" %}
            {% set ns.ok_count = ns.ok_count + 1 %}
        {% elif g == "PRESSED" %}
            {% set _ = ns.mounted.append("Tool %d" % tool_num) %}
        {% elif p == "RELEASED" and g == "RELEASED" %}
            {% set _ = ns.missing.append("Tool %d" % tool_num) %}
        {% endif %}
    {% endfor %}

    {% if ns.mounted|length > 0 %}
        M118 ERRORE: Utensile montato sul carrello: {ns.mounted[0]}
        { action_raise_error("ABORTITO: Sgancia il %s dal carrello prima di eseguire G28 / Mesh!" % ns.mounted[0]) }

    {% elif ns.missing|length > 0 %}
        M118 ERRORE: Utensile fuori sede o caduto: {ns.missing[0]}
        { action_raise_error("ABORTITO: %s non in deposito e non sul carrello! Verificare posizione." % ns.missing[0]) }

    {% else %}
        M118 Carrello libero e tutti i 4 tool in sede. Avvio procedura MESH...

        {% set B_PARAM = params.B|default(printer.heater_bed.target)|float %}
        {% set TARGET_TEMP = 60.0 if B_PARAM == 0 else B_PARAM %}

        {% if TARGET_TEMP >= 110 %}
            {% set mesh = "110" %}
        {% elif TARGET_TEMP >= 100 %}
            {% set mesh = "100" %}
        {% elif TARGET_TEMP >= 90 %}
            {% set mesh = "90" %}
        {% elif TARGET_TEMP >= 80 %}
            {% set mesh = "80" %}
        {% elif TARGET_TEMP >= 70 %}
            {% set mesh = "70" %}
        {% elif TARGET_TEMP >= 60 %}
            {% set mesh = "60" %}
        {% elif TARGET_TEMP >= 50 %}
            {% set mesh = "50" %}
        {% else %}
            {% set mesh = "40" %}
        {% endif %}

        M118 Riscaldamento piatto a {TARGET_TEMP}C per profilo {mesh}...
        M140 S{TARGET_TEMP}
        M190 S{TARGET_TEMP}
        G28
        M118 Piatto in temperatura. Avvio calibrazione mesh {mesh}...
        BED_MESH_CLEAR
        REAL_BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE={mesh}
        BED_MESH_PROFILE LOAD={mesh}
        M118 Mesh {mesh} salvata! Salvataggio configurazione e riavvio in corso...
        SAVE_AND_REBOOT
    {% endif %}

##########################################################

[gcode_macro DUMP_VARS]
description: Stampa TUTTE le variabili e gli oggetti presenti in Klipper
gcode:
    {% set ns = namespace(path=[]) %}
    {% for item in printer %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item)] %}
        {% else %}
            {% set ns.path = ['printer.', item] %}
        {% endif %}
        {% if printer[item] is mapping %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int] %}
                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %}
                {% if child is mapping %}
                    { loop(child.items()) }
                {% else %}
                    { action_respond_info("%s : %s" % (ns.path|join, child)) }
                {% endif %}
            {% endfor %}
        {% else %}
            { action_respond_info("%s : %s" % (ns.path|join, printer[item])) }
        {% endif %}
    {% endfor %}

##########################################################

[gcode_macro TEST_TOOL_SAFETY]
description: Test visivo in console per lo stato dei sensori dei tool
gcode:
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}

    {% set pos = [
        printer["gcode_button extruder_pos1"].state,
        printer["gcode_button extruder_pos2"].state,
        printer["gcode_button extruder_pos3"].state,
        printer["gcode_button extruder_pos4"].state
    ] %}

    M118 ====================================
    M118 --- REPORT SICUREZZA UTENSILI ---
    M118 ====================================

    {% set ns = namespace(errors=0, mounted=0) %}

    {% for i in range(4) %}
        {% set t_num = i + 1 %}
        {% set p = pos[i] %}
        {% set g = grab[i] %}

        {% if p == "PRESSED" and g == "RELEASED" %}
            M118 Tool {t_num}: [ OK ] -> Correttamente A DEPOSITO (POS: PRESSED | GRAB: RELEASED)
        {% elif p == "RELEASED" and g == "PRESSED" %}
            {% set ns.mounted = ns.mounted + 1 %}
            M118 Tool {t_num}: [ CARRELLO ] -> Montato sul MOTORE (POS: RELEASED | GRAB: PRESSED)
        {% elif p == "RELEASED" and g == "RELEASED" %}
            {% set ns.errors = ns.errors + 1 %}
            M118 Tool {t_num}: [ ALLARME ] -> PENZOLANTE / FUORI SEDE! (POS: RELEASED | GRAB: RELEASED)
        {% else %}
            M118 Tool {t_num}: [ TRANSIZIONE ] -> In movimento / Aggancio (POS: PRESSED | GRAB: PRESSED)
        {% endif %}
    {% endfor %}

    M118 ------------------------------------

    {% if ns.mounted > 0 %}
        M118 ESITO: [ BLOCCATO ] -> Almeno un utensile e ancora montato sul carrello.
    {% elif ns.errors > 0 %}
        M118 ESITO: [ ALLARME BLOCCANTE ] -> Almeno un utensile risulta staccato ma non al deposito!
    {% else %}
        M118 ESITO: [ OK PASS ] -> Tutti i 4 utensili a deposito. G28 / Mesh AUTORIZZATI!
    {% endif %}
    M118 ====================================

#################################################################################
#################################################################################
# 1. MACRO DI SICUREZZA PER LO STACCO Z E SPOSTAMENTO X
#################################################################################
[gcode_macro _SAFE_Z_HOP]
description: Esegue lo Z-hop una sola volta evita hop multipli
variable_z_hopped: False
variable_last_hop_amount: 0.0
gcode:
    {% set REL_Z_PRINT   = params.REL_Z_PRINT|default(0.6)|float %}
    {% set STANDBY_MIN_Z = params.STANDBY_MIN_Z|default(10.0)|float %}
    {% set SAFE_X         = params.SAFE_X|default(250.0)|float %}
    {% set SPEED_Z        = params.SPEED_Z|default(600)|int %}
    {% set SPEED_XY       = params.SPEED_XY|default(6000)|int %}

    {% if 'z' in printer.toolhead.homed_axes and 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
        {% set print_state = printer.print_stats.state %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set current_x = printer.toolhead.position.x|float %}

        # --- GESTIONE Z-HOP (Solo se non e gia stato fatto) ---
        {% if not printer["gcode_macro _SAFE_Z_HOP"].z_hopped %}
            {% if print_state == "printing" or print_state == "paused" %}
                # In stampa: Hop relativo
                {% set target_z = act_z + REL_Z_PRINT %}
                {% if target_z > max_z %}{% set target_z = max_z %}{% endif %}
                {% set actual_hop = target_z - act_z %}

                {% if actual_hop > 0 %}
                    G90
                    G1 Z{target_z} F{SPEED_Z}
                    M400
                    SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=z_hopped VALUE=True
                    SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=last_hop_amount VALUE={actual_hop}
                    M118 Z-hop eseguito: +{actual_hop}mm
                {% endif %}
            {% else %}
                # In standby: Porta a quota minima fissa se sotto i 10mm
                {% if act_z < STANDBY_MIN_Z %}
                    G90
                    G1 Z{STANDBY_MIN_Z} F{SPEED_Z}
                    M400
                    SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=z_hopped VALUE=True
                    SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=last_hop_amount VALUE=0.0
                    M118 Standby: Z portata a {STANDBY_MIN_Z}mm
                {% endif %}
            {% endif %}
        {% else %}
            M118 _SAFE_Z_HOP ignorato: Z-hop gia attivo!
        {% endif %}

        # --- POSIZIONAMENTO SICUREZZA X ---
        {% if current_x > SAFE_X %}
            G90
            G1 X{SAFE_X} F{SPEED_XY}
            M400
        {% endif %}
    {% endif %}


[gcode_macro _RESTORE_Z_HOP]
description: Ripristina la Z ed azzera lo stato di Z-hop
gcode:
    {% set SPEED_Z = params.SPEED_Z|default(600)|int %}
    {% set is_hopped = printer["gcode_macro _SAFE_Z_HOP"].z_hopped %}
    {% set hop_amt   = printer["gcode_macro _SAFE_Z_HOP"].last_hop_amount %}

    {% if is_hopped %}
        {% if hop_amt > 0 and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused") %}
            # Riabbassa la Z dell'esatto valore di cui era salita
            G91
            G1 Z-{hop_amt} F{SPEED_Z}
            G90
            M400
            M118 Z ripristinata: -{hop_amt}mm
        {% endif %}
        # Azzera il flag
        SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=z_hopped VALUE=False
        SET_GCODE_VARIABLE MACRO=_SAFE_Z_HOP VARIABLE=last_hop_amount VALUE=0.0
    {% endif %}


