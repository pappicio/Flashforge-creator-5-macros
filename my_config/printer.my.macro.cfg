[gcode_macro _CHECK_TOOL_SGANCIO]
description: Verifica che NESSUN tool sia rimasto agganciato alla testa a X291.5
gcode:
    {% set s1 = printer["gcode_button extruder_grab1"].state %}
    {% set s2 = printer["gcode_button extruder_grab2"].state %}
    {% set s3 = printer["gcode_button extruder_grab3"].state %}
    {% set s4 = printer["gcode_button extruder_grab4"].state %}

    {% if s1 == "PRESSED" or s2 == "PRESSED" or s3 == "PRESSED" or s4 == "PRESSED" %}
        { action_raise_error("ERRORE CRITICO: Un tool risulta ancora AGGANCIATO a X291.5! Sgancio fallito. Arresto di emergenza!") }
    {% else %}
        M118 Sgancio confermato (tutti i sensori RELEASED). Completo uscita dal dock...
    {% endif %}


#################################################################################
# 2. SUBROUTINE FISICA DI DEPOSITO UTENSILE
#################################################################################

[gcode_macro _DEPOSITA_TOOL_FISICO]
description: Sgancio fisico nel dock con retrazione preventiva
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("ABORTITO: Tentativo di eseguire _DEPOSITA_TOOL_FISICO senza Homing (X/Y/Z)!") }
    {% else %}
        {% set F_NORMAL = 4800 %}
        {% set F_AGGANCIO = 2400 %}
        {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}

        {% set grab = [
            printer["gcode_button extruder_grab1"].state,
            printer["gcode_button extruder_grab2"].state,
            printer["gcode_button extruder_grab3"].state,
            printer["gcode_button extruder_grab4"].state
        ] %}
        {% set ns = namespace(mounted=[]) %}
        {% for i in range(4) %}
            {% if grab[i] == "PRESSED" %}
                {% set _ = ns.mounted.append(i+1) %}
            {% endif %}
        {% endfor %}

        {% if ns.mounted|length == 0 %}
            M118 Nessun tool da depositare.
        {% elif ns.mounted|length > 1 %}
            { action_raise_error("ABORTITO: piu di un sensore grab PRESSED contemporaneamente") }
        {% else %}
            {% set TOOL = ns.mounted[0] %}

            # 1. Retrazione preventiva per evitare colature sul dock se l ugello e caldo
            {% set active_ext = printer.toolhead.extruder %}
            {% if printer[active_ext].can_extrude %}
                M118 Retrazione di sicurezza prima del deposito (2mm)...
                G92 E0
                G1 E-2.0 F2100
                G92 E0
            {% endif %}

            # 2. Z-Hop (gestito internamente da _SAFE_Z_HOP)
            _SAFE_Z_HOP

            # 3. Traslazione sul dock
            M118 Deposito fisico Tool {TOOL} in corso...
            G90
            G1 Y{y_map[TOOL]} F{F_NORMAL}
            M400
            M118 Avvicinamento lento a X295...
            G1 X296.5 F{F_AGGANCIO}
            M400

            # 4. Sblocco meccanico
            STEPPER_UNLOCK
            M400
	    # 5. Micro-arretramento di test (5mm per scaricare il sensore dal dock)
            G1 X289 F{F_AGGANCIO}
            M400

	    # 6. Check globale (senza parametri T)
            _CHECK_TOOL_SGANCIO

            # 5. Uscita dal dock
            G1 X250 F{F_NORMAL}
            M400

            M118 Tool {TOOL} depositato con successo.
        {% endif %}
    {% endif %}


#################################################################################
# 3. MACRO PUBBLICA DI DEPOSITO UTENSILE
#################################################################################

[gcode_macro DEPOSITA_TOOL]
description: Deposita l utensile attualmente montato (esegue G28 se non homata)
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        M118 Macchina non homata (X/Y/Z): avvio G28...
        G28
    {% else %}
        M118 Macchina homata: eseguo deposito diretto...
        _DEPOSITA_TOOL_FISICO
    {% endif %}


#################################################################################
# 4. SUBROUTINE FISICA DI PRELIEVO UTENSILE
#################################################################################

[gcode_macro _PRELEVA_TOOL_FISICO]
description: Movimenti fisici di prelievo tool con ripristino filamento
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("ABORTITO: Tentativo di eseguire _PRELEVA_TOOL_FISICO senza Homing (X/Y/Z)!") }
    {% else %}
        {% set F_NORMAL = 4800 %}
        {% set F_AGGANCIO = 2400 %}
        {% set TOOL = params.T|default(1)|int %}
        {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}

        {% if TOOL not in y_map %}
            { action_raise_error("ABORTITO: Tool non valido in _PRELEVA_TOOL_FISICO") }
        {% else %}
            # 1. Z-Hop (gestito internamente da _SAFE_Z_HOP)
            _SAFE_Z_HOP

            # 2. Allineamento Y ed entrata nel dock
            M118 Prelievo Tool {TOOL} in corso...
            G90
            G1 Y{y_map[TOOL]} F{F_NORMAL}
            M400
            M118 Avvicinamento lento a X295...
            G1 X296.5 F{F_AGGANCIO}
            M400

            # 3. Blocco meccanico
            MOTOR_GRAB
            M400
            MOTOR_GRAB2
            M400

            # 4. Estrazione tool a X250
            G1 X250 F{F_NORMAL}
            M400

            # 5. Ripristino filamento (Un-retract) se l ugello e caldo
            {% set active_ext = printer.toolhead.extruder %}
            {% if printer[active_ext].can_extrude %}
                M118 Ripristino filamento sul nuovo tool (2mm)...
                G92 E0
                G1 E2.0 F2100
                G92 E0
            {% endif %}

            M118 Tool {TOOL} agganciato.
        {% endif %}
    {% endif %}


#################################################################################
# 5. MACRO PUBBLICA DI PRELIEVO UTENSILE
#################################################################################

[gcode_macro PRELEVA_TOOL]
description: Preleva il tool N, attiva l estrusore e attende la temperatura target se in stampa
gcode:
    {% set TOOL = params.T|default(1)|int %}
    {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}
    {% set ext_names = {1: "extruder", 2: "extruder1", 3: "extruder2", 4: "extruder3"} %}

    {% if TOOL not in y_map %}
        { action_raise_error("ABORTITO: numero tool non valido o parametro T mancante (usa T=1, T=2, T=3 o T=4)") }
    {% else %}
        {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
            M118 Macchina non homata (X/Y/Z): avvio G28 e imposto TARGET={TOOL}...
            G28 TARGET={TOOL}
        {% else %}
            {% set grab = [
                printer["gcode_button extruder_grab1"].state,
                printer["gcode_button extruder_grab2"].state,
                printer["gcode_button extruder_grab3"].state,
                printer["gcode_button extruder_grab4"].state
            ] %}
            {% set ns = namespace(mounted=[]) %}
            {% for i in range(4) %}
                {% if grab[i] == "PRESSED" %}
                    {% set _ = ns.mounted.append(i+1) %}
                {% endif %}
            {% endfor %}

            {% if ns.mounted|length > 1 %}
                { action_raise_error("ABORTITO: piu di un sensore grab PRESSED contemporaneamente, stato anomalo") }
            {% elif ns.mounted|length == 1 and ns.mounted[0] == TOOL %}
                # TOOL GIA MONTATO: Non fa nessun Z-hop, nessuna movimentazione!
                M118 Tool {TOOL} e gia montato, nessuna azione necessaria.
            {% else %}
                # --- INIZIO PROCEDURA CAMBIO TOOL EFFETTIVA ---

                # 1. Deposita l eventuale tool montato
                {% if ns.mounted|length == 1 %}
                    M118 Tool {ns.mounted[0]} montato, deposito prima di prelevare Tool {TOOL}...
                    _DEPOSITA_TOOL_FISICO
                {% endif %}

                # 2. Preleva il nuovo tool (esegue internamente _SAFE_Z_HOP una sola volta)
                _PRELEVA_TOOL_FISICO T={TOOL}

                # 3. Attiva il driver estrusore Klipper corrispondente
                {% set new_ext = ext_names[TOOL] %}
                ACTIVATE_EXTRUDER EXTRUDER={new_ext}

                # 4. Attesa temperatura target se la stampante e in esecuzione
                {% set print_state = printer.print_stats.state %}
                {% set target_temp = printer[new_ext].target|float %}

                {% if (print_state == "printing" or print_state == "paused") and target_temp > 0 %}
                    {% set current_temp = printer[new_ext].temperature|float %}
                    {% if current_temp < (target_temp - 2.0) %}
                        M118 Attesa riscaldamento Tool {TOOL} ({current_temp}C -> {target_temp}C)...
                        M109 S{target_temp}
                        M118 Temperatura target raggiunta.
                    {% endif %}
                {% endif %}

                # 5. RIPRISTINO Z-HOP
                # Si attiva SOLO se c e stato un cambio tool reale e riabbassa la Z sul pezzo.
                _RESTORE_Z_HOP

            {% endif %}
        {% endif %}
    {% endif %}




#################################################################################
[gcode_macro LOAD_FILAMENT]
description: Ciclo completo con controlli di sicurezza homing e presenza/cambio tool.
gcode:
    {% set TOOL_HUMAN = params.T|default(1)|int %}

    {% set PURGE_LENGTH = 100.0 %}
    {% set PURGE_FEEDRATE = 300 %}
    {% set RETRACT_LENGTH = -5.0 %}
    {% set RETRACT_FEEDRATE = 240 %}

    {% set TEMP_PURGE = 240 %}

    {% set X_SPURGO = 273.000 %}
    {% set Y_SPURGO = 255.000 %}

    {% set SPEED_XY = 4800 %}
    {% set SPEED_Z = 600 %}

    {% if TOOL_HUMAN < 1 or TOOL_HUMAN > 4 %}
        { action_raise_error("ABORTITO: Numero tool non valido! Usa T=1, T=2, T=3 o T=4.") }
    {% else %}
        {% set TOOL = TOOL_HUMAN - 1 %}

        # 1. PRELIEVO TOOL (Gestisce homing e deposito eventuale tool gia montato)
        PRELEVA_TOOL T={TOOL_HUMAN}

        # 2. RISCALDAMENTO E SPURGO
        M118 Riscaldamento Tool {TOOL_HUMAN} a {TEMP_PURGE}C per spurgo...
        M104 S{TEMP_PURGE} T{TOOL}

        M118 Posizionamento in sicurezza alle coordinate di spurgo...
        _SAFE_Z_HOP

        G1 Y{Y_SPURGO} F{SPEED_XY}
        G1 X{X_SPURGO} F{SPEED_XY}
        M400

        M109 S{TEMP_PURGE} T{TOOL}
        M118 Eseguisco spurgo di {PURGE_LENGTH} mm...
        G92 E0
        G1 E{PURGE_LENGTH} F{PURGE_FEEDRATE}
        M400

        M118 Eseguo ritrazione di {RETRACT_LENGTH} mm...
        G92 E0
        G1 E{RETRACT_LENGTH} F{RETRACT_FEEDRATE}
        M400

        # 3. PULIZIA UGELLO
        M118 Pulizia ugello...
        CLEAN_NOZZLE FROM_LOAD=1
        M118 Ciclo LOAD_FILAMENT completato con successo!
    {% endif %}



#################################################################################
[gcode_macro CLEAN_NOZZLE]
description: Pulisce l'ugello e raffredda sul silicone mantenendo la coordinata Z.
gcode:
    {% set START_Z_LIFT = 10.0 %}
    {% set STAGING_X = 250.0 %}
    {% set STAGING_Y = 0.0 %}
    {% set CLEAN_Z = 3.0 %}
    {% set X_LEFT = 263.0 %}
    {% set X_RIGHT = 270.0 %}
    {% set SPEED_Z = 600 %}
    {% set SPEED_MOVE = 4800 %}
    {% set SPEED_CLEAN = 2400 %}
    {% set MIN_CLEAN_TEMP = 140.0 %}
    {% set TARGET_CLEAN_TEMP = 240.0 %}

    {% set X_SILICONE = 266.500 %}
    {% set Y_SILICONE = 13.800 %}
    {% set Z_SILICONE = 0.969 %}
    {% set TEMP_SAFE = 140 %}
    {% set SPEED_XY = 4800 %}

    # 1. SALVATAGGIO QUOTA Z INIZIALE
    {% set initial_z = printer.toolhead.position.z|float %}

    # 2. VERIFICA SENSORI PRESENZA TOOL SUL CARRELLO
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}
    {% set ns = namespace(mounted=[]) %}
    {% for i in range(4) %}
        {% if grab[i] == "PRESSED" %}
            {% set _ = ns.mounted.append(i+1) %}
        {% endif %}
    {% endfor %}

    # 3. DETERMINAZIONE TOOL RICHIESTO
    {% set req_t = params.T|default(0)|int %}
    {% if req_t == 0 and ns.mounted|length > 0 %}
        {% set TOOL_HUMAN = ns.mounted[0] %}
    {% else %}
        {% set TOOL_HUMAN = req_t %}
    {% endif %}

    # 4. VERIFICA HOMING
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        M118 Macchina non homata: avvio G28...
        {% if TOOL_HUMAN > 0 %}
            G28 TARGET={TOOL_HUMAN}
        {% else %}
            G28
        {% endif %}
    {% endif %}

    # 5. GESTIONE CARRELLO E PRELIEVO TOOL
    {% if ns.mounted | length > 1 %}
        { action_raise_error("ABORTITO: Piu di un sensore grab PRESSED contemporaneamente!") }
    {% elif ns.mounted | length == 0 %}
        {% if TOOL_HUMAN > 0 %}
            M118 Carrello vuoto. Prelevo automaticamente il Tool {TOOL_HUMAN} per la pulizia...
            PRELEVA_TOOL T={TOOL_HUMAN}
        {% else %}
            { action_raise_error("ABORTITO: Nessun tool montato e nessun tool specificato (usa CLEAN_NOZZLE T=1).") }
        {% endif %}
    {% else %}
        {% set current_mounted = ns.mounted[0] %}
        {% if TOOL_HUMAN > 0 and TOOL_HUMAN != current_mounted %}
            M118 Richiesto Tool {TOOL_HUMAN} ma e montato T{current_mounted}. Eseguo il cambio...
            PRELEVA_TOOL T={TOOL_HUMAN}
        {% else %}
            M118 Tool {current_mounted} gia pronto sul carrello. Procedo con la pulizia...
        {% endif %}
    {% endif %}

    # 6. CONTROLLO TEMPERATURA
    {% set TOOL_INDEX = TOOL_HUMAN - 1 %}
    {% set current_extruder = "extruder" if TOOL_INDEX == 0 else "extruder" ~ TOOL_INDEX %}
    {% set current_temp = printer[current_extruder].temperature|float %}
    {% set from_load = params.FROM_LOAD|default(0)|int %}

    {% if from_load == 1 %}
        M118 Pulizia avviata da LOAD_FILAMENT (Temp: {current_temp}C).
    {% else %}
        {% if current_temp < TARGET_CLEAN_TEMP %}
            M118 Chiamata diretta: riscaldo Tool {TOOL_HUMAN} a {TARGET_CLEAN_TEMP}C...
            M109 S{TARGET_CLEAN_TEMP} T{TOOL_INDEX}
        {% else %}
            M118 Temperatura Tool {TOOL_HUMAN} gia a regime ({current_temp}C). Procedo.
        {% endif %}
    {% endif %}

    # 7. ESECUZIONE PULIZIA (Movimenti in quota assoluta G90)
    G90
    G1 Z{START_Z_LIFT} F{SPEED_Z}
    M400

    G1 X{STAGING_X} F{SPEED_MOVE}
    G1 Y{STAGING_Y} F{SPEED_MOVE}
    G1 X{X_RIGHT} F{SPEED_MOVE}
    M400

    G1 Z{CLEAN_Z} F{SPEED_Z}
    M400

    {% for i in range(3) %}
        G1 X{X_LEFT} F{SPEED_CLEAN}
        G1 X{X_RIGHT} F{SPEED_CLEAN}
    {% endfor %}
    G1 X{X_LEFT} F{SPEED_CLEAN}
    M400

    # 8. RAFFREDDAMENTO SU SILICONE
    M118 Spengo riscaldatore Tool {TOOL_HUMAN}...
    SET_HEATER_TEMPERATURE HEATER={current_extruder} TARGET=0

    G1 Z{START_Z_LIFT} F{SPEED_Z}
    M400

    M118 Sposto sul cuscinetto di raffreddamento...
    G1 Y{Y_SILICONE} F{SPEED_XY}
    G1 X{X_SILICONE} F{SPEED_XY}

    M118 Discesa sul silicone a quota Z={Z_SILICONE} mm...
    G1 Z{Z_SILICONE} F{SPEED_Z}
    M400

    M118 Attendo raffreddamento a {TEMP_SAFE}C...
    TEMPERATURE_WAIT SENSOR={current_extruder} MAXIMUM={TEMP_SAFE|float}

    # 9. DISIMPEGNO, SPOSTAMENTO X250, DEPOSITO E RIPRISTINO Z
    M118 Sollevamento di sicurezza a Z={START_Z_LIFT}mm...
    G1 Z{START_Z_LIFT} F{SPEED_Z}
    M400

    M118 Spostamento all'ingresso del dock (X=250)...
    G1 X250 F{SPEED_XY}
    M400

    M118 Deposito il Tool {TOOL_HUMAN}...
    DEPOSITA_TOOL

    {% if initial_z > START_Z_LIFT %}
        M118 Ripristino Z alla quota di partenza ({initial_z}mm)...
        G1 Z{initial_z} F{SPEED_Z}
        M400
    {% endif %}

    M118 Pulizia ugello completata. Zero Z preservato.

#################################################################################

[gcode_macro DISABILITA_MOTORI]
description: Spegne la coppia dei motori stepper per muoverli a mano
gcode:
    M400
    M84
    M118 Motori disabilitati. Carrello libero.


#################################################################################

[gcode_macro SBLOCCA_XY]
description: Disabilita solo i motori X e Y mantenendo Z bloccato
gcode:
    M400
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    M118 Assi X e Y sbloccati.

#################################################################################

[gcode_shell_command REBOOT_HOST]
command: /usr/data/home/pwned/reboot.sh
timeout: 5
verbose: True

[gcode_macro REBOOT_PRINTER]
variable_value: 0
gcode:
    RUN_SHELL_COMMAND CMD=REBOOT_HOST

#################################################################################

[gcode_shell_command REBOOT_HOST_CMD]
command: /usr/data/home/pwned/host_reboot.sh
timeout: 2
verbose: True

[gcode_macro SAVE_AND_REBOOT]
gcode:
    SAVE_CONFIG
    RUN_SHELL_COMMAND CMD=REBOOT_HOST_CMD

#################################################################################

[gcode_shell_command RESTART_KLIPPER_SHELL]
command: /bin/sh -c "/usr/prog/klipper/klipperDaemon restart >/dev/null 2>&1 &"
timeout: 5
verbose: False

[gcode_shell_command RESTART_MOONRAKER_SHELL]
command: /bin/sh -c "/usr/prog/klipper/moonrakerDaemon restart >/dev/null 2>&1 &"
timeout: 5
verbose: False

#################################################################################

[delayed_gcode LED_AUTO_ON]
initial_duration: 10.0
gcode:
    SET_LED LED=chamber_led WHITE=0.5

[gcode_macro RIAVVIA_MOONRAKER]
variable_value: 0
description: Riavvia il servizio Moonraker
gcode:
    RUN_SHELL_COMMAND CMD=RESTART_MOONRAKER_SHELL

[gcode_macro RIAVVIA_KLIPPER]
variable_value: 0
description: Riavvia il servizio Klipper
gcode:
    RUN_SHELL_COMMAND CMD=RESTART_KLIPPER_SHELL



#########################################################################################################################################################################################à

###############################################################################################################################################################
### needed: gshell command installed:                                                                                                                       ###
### wget -O /usr/prog/klipper/klippy/extras/gcode_shell_command.py https://raw.githubusercontent.com/dw-0/kiauh/master/resources/gcode_shell_command.py     ###
### on esphome device with a switch named: interruttore!!!                                                                                                  ###
### add in your "END_PRINT" macro or END_PRINT slicer gcodes thes line:                                                                                     ###
                                                                                                                                                            ###
### UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10                                                                               ###
###                                 AND                                                                                                                     ###
### in START_PRINT slicer gcoeds reset timer of delayed cacro:                                                                                              ###
### UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=0                                                                                ###
###############################################################################################################################################################

[gcode_shell_command shutdown_printer]
command: /opt/bin/curl -s -X POST http://192.168.1.89/switch/interruttore/turn_off
timeout: 5
verbose: True

[delayed_gcode ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO]
gcode:
    {% set e0 = printer['extruder'].temperature %}
    {% set e1 = printer['extruder1'].temperature %}
    {% set e2 = printer['extruder2'].temperature %}
    {% set e3 = printer['extruder3'].temperature %}
    {% if e0 <= 45 and e1 <= 45 and e2 <= 45 and e3 <= 45 %}
        RUN_SHELL_COMMAND CMD=shutdown_printer
        RESPOND MSG="Tutti gli hotend sotto 45C, spegnimento inviato"
    {% else %}
        RESPOND MSG="Attesa raffreddamento: E0={e0}C E1={e1}C E2={e2}C E3={e3}C"
        UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10
    {% endif %}
###############################################################################################################################################################
