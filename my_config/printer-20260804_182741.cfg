[output_pin DC24V_CTL]
pin: eheaterboard:PA3
value: 1

[verify_heater extruder]
max_error: 400
check_gain_time:4000
hysteresis: 10
heating_gain: 10

[heater_bed]
heater_pin: PD2
sensor_type: Generic 3950
sensor_pin: PC3
pullup_resistor: 4700
#control: pid
#pid_Kp: 68.196
#pid_Ki: 0.834
#pid_Kd: 1393.753
#control: watermark
max_power: 1.0
min_temp: -100
max_temp: 130

[verify_heater heater_bed]       
max_error: 200                   
check_gain_time:4000              
hysteresis: 10                   
heating_gain: 5

[input_shaper]
