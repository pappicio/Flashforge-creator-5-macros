

### to enable M117
[display_status]

### to enable M118
[respond]
default_type: command
###default_type: echo
###default_prefix:

###########################################################################################

[screws_tilt_adjust]
screw1: 32, 230
screw1_name: rear left screw (FIXED BASE)
screw2: 248, 231
screw2_name: rear right screw
screw3: 250, 16
screw3_name: front right screw
screw4: 30, 16
screw4_name: front left screw
speed: 100
horizontal_move_z: 10
screw_thread: CW-M4

###########################################################################################
[homing_override]
axes: xyz
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}

    # 0. PARSING PARAMETRI ED ESTRAZIONE TARGET
    {% set raw = rawparams|default('')|upper %}
    {% set TARGET = 0 %}
    {% if 'TARGET=' in raw %}
        {% set TARGET = raw.split('TARGET=')[1].split()[0]|int %}
    {% endif %}

    # --- SOSTITUISCI DA QUI ---
# 1. STACCO Z DI EMERGENZA DIRETTO
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% if act_z < (max_z - 10.0) %}
            {% set z_hop = 10.0 %}
        {% else %}
            {% set z_hop = max_z - act_z %}
        {% endif %}

        {% if z_hop > 0 %}
            M118 Stacco Z relativo di +{z_hop}mm...
            G91
            G1 Z{z_hop} F600
            G90
            M400
        {% endif %}
    {% else %}
        # Macchina non homata: diamo lo zero fittizio e alziamo a 10 in assoluto
        M118 Z non homato: stacco temporaneo a quota sicura 10mm...
        SET_KINEMATIC_POSITION Z=0
        G90
        G1 Z10 F600
        M400
    {% endif %}


    # 2. VERIFICA UTENSILE MONTATO SUL CARRELLO

    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}

    {% set ns = namespace(mounted=false, tool=0) %}
    {% for state in grab %}
        {% if state == "PRESSED" %}
            {% set ns.mounted = true %}
            {% set ns.tool = loop.index %}
        {% endif %}
    {% endfor %}

    # 3. DETERMINAZIONE ASSI DA HOMARE
    {% set home_all = (not 'X' in raw and not 'Y' in raw and not 'Z' in raw) %}
    {% set home_x = 'X' in raw or home_all %}
    {% set home_y = 'Y' in raw or home_all %}
    {% set home_z = 'Z' in raw or home_all %}

    # 4. FLUSSO PRINCIPALE HOMING
    {% if ns.mounted %}
        M118 Utensile T{ns.tool} rilevato sul carrello! Eseguo Home XY...
        G28 X Y
        M118 Spostamento a X130 Y130 prima del deposito...
        G1 X130 Y130 F6000

        _DEPOSITA_TOOL_FISICO

        M118 Carrello vuoto. Ritorno a X130 Y130...
        G1 X130 Y130 F6000
        M118 Eseguo Home Z dopo aver depositato...
        G28 Z

        # Posizionamento Z a quota sicura 10mm post-homing Z
        G90
        G1 Z10 F600

        # GESTIONE RIAGGANCIO / CAMBIO TARGET
        {% if TARGET > 0 %}
            M118 Prelevo il target richiesto T{TARGET}...
            _PRELEVA_TOOL_FISICO T={TARGET}
        {% else %}
            M118 Rimonto utensile iniziale T{ns.tool}...
            _PRELEVA_TOOL_FISICO T={ns.tool}
        {% endif %}

    {% else %}
        M118 Nessun utensile sul carrello.
        {% if home_all %}
            G28 X Y
            G1 X130 Y130 F6000
            G28 Z
            G90
            G1 Z10 F600

            {% if TARGET > 0 %}
                M118 Prelevo il target richiesto T{TARGET}...
                _PRELEVA_TOOL_FISICO T={TARGET}
            {% endif %}

        {% else %}
            {% if home_x and home_y %}
                G28 X Y
            {% elif home_x %}
                G28 X
            {% elif home_y %}
                G28 Y
            {% endif %}

            {% if home_z %}
                {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
                    M118 Homing XY necessario prima di fare Home Z...
                    G28 X Y
                {% endif %}
                M118 Spostamento al centro X130 Y130 per Home Z...
                G1 X130 Y130 F6000
                G28 Z
                G90
                G1 Z10 F600
            {% elif home_x or home_y %}
                M118 Spostamento di sicurezza al centro X130 Y130...
                G1 X130 Y130 F6000
            {% endif %}

            {% if TARGET > 0 %}
                M118 Prelevo il target richiesto T{TARGET}...
                _PRELEVA_TOOL_FISICO T={TARGET}
            {% endif %}
        {% endif %}
    {% endif %}

###########################################################################################
