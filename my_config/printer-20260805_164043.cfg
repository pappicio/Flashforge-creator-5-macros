###default_prefix:





[extruder]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC6
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC0
#control: pid
#pid_Kp: 45
#pid_Ki: 3
#pid_Kd: 35
#pwm_cycle_time: 0.1
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance:0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance:500
max_extrude_cross_section:800
max_extrude_only_velocity:30
max_extrude_only_accel:5000
full_steps_per_rotation:200

