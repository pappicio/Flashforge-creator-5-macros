
###############################################################

[include mainsail.cfg]

[include timelapse.cfg]

[include printer.my.config.cfg]

###############################################################
### to enable M117
[display_status]

### to enable M118
[respond]
default_type: command
###default_type: echo
###default_prefix:

########################              DOESN'T WORK WELL....    ORCASLICER START PRINT MACHINE GCODE   ########################
### ;start_gcode
### M109 S[nozzle_temperature_initial_layer] T[initial_extruder]
### START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer] EXTRUDER=[initial_extruder] TOTAL_LAYER=[total_layer_count] MAX_VOL_SPEED={filament_max_volumetric_speed[initial_no_support_extruder]}
### ;start_gcode end

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(0)|int %}
    {% set TOTAL_LAYER = params.TOTAL_LAYER|default(1)|int %}
    {% set MAX_VOL_SPEED = params.MAX_VOL_SPEED|default(300)|float %}

    M118 START_PRINT: chiamata ricevuta
    M118 START_PRINT: BED_TEMP={BED_TEMP} EXTRUDER_TEMP={EXTRUDER_TEMP} EXTRUDER={EXTRUDER} TOTAL_LAYER={TOTAL_LAYER} MAX_VOL_SPEED={MAX_VOL_SPEED}

    M118 START_PRINT: set bed temp
    M140 S{BED_TEMP}

    M118 START_PRINT: fan setup
    M106 P101 S0 ; L+R_PLA_Turbo_Fan_0-255
    M106 P2 S0   ; Center_Fresh_Air_Input_Fan
    M106 S0      ; Model_Fan
    M106 P3 S0   ; Filter_Unit_Fan

    M118 START_PRINT: G90/M83
    G90
    M83

    M118 START_PRINT: lift Z
    G1 Z5 F2400

    M118 START_PRINT: set total layer
    SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYER}

    M118 START_PRINT: carico mesh temperatura
    CARICA_MESH_TEMPERATURA
    M118 START_PRINT: mesh temperatura caricata

    M118 START_PRINT: seleziono tool T{EXTRUDER}

    {% set extruderstr = "extruder" if EXTRUDER|int == 0 else "extruder" ~ (EXTRUDER|int) %}

    ###ACTIVATE_EXTRUDER EXTRUDER={extruderstr}

    M118 START_PRINT: tool T{EXTRUDER} selezionato
    M118 START_PRINT: tool EXTRUDER NAME={extruderstr}
    M118 START_PRINT: attendo temperatura estrusore {EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP} T{EXTRUDER}
    M118 START_PRINT: temperatura raggiunta

    M118 START_PRINT: posizionamento purge line
    G1 X256 Y0 Z0.2 F6000
    G1 E5 F{MAX_VOL_SPEED / 2.4053 * 60}
    G1 X216 E10 F{MAX_VOL_SPEED / 2.4053 * 60}

    M118 START_PRINT: fine start print

##########################################################

[gcode_macro END_PRINT]
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91
    G1 E-1.2 Z{z_safe} F3000
    G90
    G1 X150 Y150 F12000
    UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10
##########################################################

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: REAL_BED_MESH_CALIBRATE
gcode:
    M118 Intercettato comando Flashforge: livellamento ignorato. Uso mesh pre-salvata.

##########################################################

[gcode_macro CARICA_MESH_TEMPERATURA]
gcode:
    {% set BED_TEMP = params.BED|default(printer.heater_bed.target)|float %}

    {% if BED_TEMP >= 110 %}
        {% set MESH_TARGET = "110" %}
    {% elif BED_TEMP >= 100 %}
        {% set MESH_TARGET = "100" %}
    {% elif BED_TEMP >= 90 %}
        {% set MESH_TARGET = "90" %}
    {% elif BED_TEMP >= 80 %}
        {% set MESH_TARGET = "80" %}
    {% elif BED_TEMP >= 70 %}
        {% set MESH_TARGET = "70" %}
    {% elif BED_TEMP >= 60 %}
        {% set MESH_TARGET = "60" %}
    {% elif BED_TEMP >= 50 %}
        {% set MESH_TARGET = "50" %}
    {% else %}
        {% set MESH_TARGET = "40" %}
    {% endif %}

    {% set SALVATI = printer.bed_mesh.profiles %}

    {% if MESH_TARGET in SALVATI %}
        M118 Caricamento mesh salvata per profilo {MESH_TARGET} (Target: {BED_TEMP}C)
        BED_MESH_PROFILE LOAD={MESH_TARGET}
    {% else %}
        M118 ====================================================
        M118 !!! MESH {MESH_TARGET} NON PRESENTE SU DISCO !!!
        M118 Annullamento stampa e avvio calibrazione automatica...
        M118 ====================================================

        CANCEL_PRINT
        M140 S{BED_TEMP}
        DEPOSITA_TOOL
        SALVA_MESH_TEMPERATURA B={BED_TEMP|int}
        DISABILITA_MOTORI
    {% endif %}

##########################################################

[gcode_macro SALVA_MESH_TEMPERATURA]
description: Verifica la sicurezza degli utensili e avvia la calibrazione della mesh
gcode:
    _VERIFICA_E_ESECUZIONE_MESH {rawparams}

##########################################################

[gcode_macro _VERIFICA_E_ESECUZIONE_MESH]
gcode:
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}

    {% set pos = [
        printer["gcode_button extruder_pos1"].state,
        printer["gcode_button extruder_pos2"].state,
        printer["gcode_button extruder_pos3"].state,
        printer["gcode_button extruder_pos4"].state
    ] %}

    {% set ns = namespace(mounted=[], missing=[], ok_count=0) %}

    {% for i in range(4) %}
        {% set tool_num = i + 1 %}
        {% set p = pos[i] %}
        {% set g = grab[i] %}

        {% if p == "PRESSED" and g == "RELEASED" %}
            {% set ns.ok_count = ns.ok_count + 1 %}
        {% elif g == "PRESSED" %}
            {% set _ = ns.mounted.append("Tool %d" % tool_num) %}
        {% elif p == "RELEASED" and g == "RELEASED" %}
            {% set _ = ns.missing.append("Tool %d" % tool_num) %}
        {% endif %}
    {% endfor %}

    {% if ns.mounted|length > 0 %}
        M118 ERRORE: Utensile montato sul carrello: {ns.mounted[0]}
        { action_raise_error("ABORTITO: Sgancia il %s dal carrello prima di eseguire G28 / Mesh!" % ns.mounted[0]) }

    {% elif ns.missing|length > 0 %}
        M118 ERRORE: Utensile fuori sede o caduto: {ns.missing[0]}
        { action_raise_error("ABORTITO: %s non in deposito e non sul carrello! Verificare posizione." % ns.missing[0]) }

    {% else %}
        M118 Carrello libero e tutti i 4 tool in sede. Avvio procedura MESH...

        {% set B_PARAM = params.B|default(printer.heater_bed.target)|float %}
        {% set TARGET_TEMP = 60.0 if B_PARAM == 0 else B_PARAM %}

        {% if TARGET_TEMP >= 110 %}
            {% set mesh = "110" %}
        {% elif TARGET_TEMP >= 100 %}
            {% set mesh = "100" %}
        {% elif TARGET_TEMP >= 90 %}
            {% set mesh = "90" %}
        {% elif TARGET_TEMP >= 80 %}
            {% set mesh = "80" %}
        {% elif TARGET_TEMP >= 70 %}
            {% set mesh = "70" %}
        {% elif TARGET_TEMP >= 60 %}
            {% set mesh = "60" %}
        {% elif TARGET_TEMP >= 50 %}
            {% set mesh = "50" %}
        {% else %}
            {% set mesh = "40" %}
        {% endif %}

        M118 Riscaldamento piatto a {TARGET_TEMP}C per profilo {mesh}...
        M140 S{TARGET_TEMP}
        M190 S{TARGET_TEMP}
        G28
        M118 Piatto in temperatura. Avvio calibrazione mesh {mesh}...
        BED_MESH_CLEAR
        REAL_BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE={mesh}
        BED_MESH_PROFILE LOAD={mesh}
        M118 Mesh {mesh} salvata! Salvataggio configurazione e riavvio in corso...
        SAVE_AND_REBOOT
    {% endif %}

##########################################################

[gcode_macro DUMP_VARS]
description: Stampa TUTTE le variabili e gli oggetti presenti in Klipper
gcode:
    {% set ns = namespace(path=[]) %}
    {% for item in printer %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item)] %}
        {% else %}
            {% set ns.path = ['printer.', item] %}
        {% endif %}
        {% if printer[item] is mapping %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int] %}
                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %}
                {% if child is mapping %}
                    { loop(child.items()) }
                {% else %}
                    { action_respond_info("%s : %s" % (ns.path|join, child)) }
                {% endif %}
            {% endfor %}
        {% else %}
            { action_respond_info("%s : %s" % (ns.path|join, printer[item])) }
        {% endif %}
    {% endfor %}

##########################################################

[gcode_macro TEST_TOOL_SAFETY]
description: Test visivo in console per lo stato dei sensori dei tool
gcode:
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}

    {% set pos = [
        printer["gcode_button extruder_pos1"].state,
        printer["gcode_button extruder_pos2"].state,
        printer["gcode_button extruder_pos3"].state,
        printer["gcode_button extruder_pos4"].state
    ] %}

    M118 ====================================
    M118 --- REPORT SICUREZZA UTENSILI ---
    M118 ====================================

    {% set ns = namespace(errors=0, mounted=0) %}

    {% for i in range(4) %}
        {% set t_num = i + 1 %}
        {% set p = pos[i] %}
        {% set g = grab[i] %}

        {% if p == "PRESSED" and g == "RELEASED" %}
            M118 Tool {t_num}: [ OK ] -> Correttamente A DEPOSITO (POS: PRESSED | GRAB: RELEASED)
        {% elif p == "RELEASED" and g == "PRESSED" %}
            {% set ns.mounted = ns.mounted + 1 %}
            M118 Tool {t_num}: [ CARRELLO ] -> Montato sul MOTORE (POS: RELEASED | GRAB: PRESSED)
        {% elif p == "RELEASED" and g == "RELEASED" %}
            {% set ns.errors = ns.errors + 1 %}
            M118 Tool {t_num}: [ ALLARME ] -> PENZOLANTE / FUORI SEDE! (POS: RELEASED | GRAB: RELEASED)
        {% else %}
            M118 Tool {t_num}: [ TRANSIZIONE ] -> In movimento / Aggancio (POS: PRESSED | GRAB: PRESSED)
        {% endif %}
    {% endfor %}

    M118 ------------------------------------

    {% if ns.mounted > 0 %}
        M118 ESITO: [ BLOCCATO ] -> Almeno un utensile e ancora montato sul carrello.
    {% elif ns.errors > 0 %}
        M118 ESITO: [ ALLARME BLOCCANTE ] -> Almeno un utensile risulta staccato ma non al deposito!
    {% else %}
        M118 ESITO: [ OK PASS ] -> Tutti i 4 utensili a deposito. G28 / Mesh AUTORIZZATI!
    {% endif %}
    M118 ====================================

#################################################################################
#################################################################################
# 1. MACRO DI SICUREZZA PER LO STACCO Z E SPOSTAMENTO X
#################################################################################
[gcode_macro _SAFE_Z_HOP]
description: Porta Z a quota minima di sicurezza assoluta e X a X250 (solo se homata)
gcode:
    {% set MIN_Z = params.MIN_Z|default(10.0)|float %}
    {% set SAFE_X = params.SAFE_X|default(250.0)|float %}
    {% set SPEED_Z = params.SPEED_Z|default(600)|int %}
    {% set SPEED_XY = params.SPEED_XY|default(6000)|int %}

    # CONTROLLO DI SICUREZZA: SE NON Ã HOMATO, USCIAMO SUBITO SENZA FARE DANNI
    {% if 'z' not in printer.toolhead.homed_axes or 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        M118 _SAFE_Z_HOP saltato: assi non ancora homati.
    {% else %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% set current_x = printer.toolhead.position.x|float %}

        # 1. Se siamo sotto la quota di sicurezza Z, alziamoci in assoluto a MIN_Z
        {% if act_z < MIN_Z %}
            M118 Z sotto quota ({act_z}mm): porto a Z{MIN_Z} in sicurezza...
            G90
            G1 Z{MIN_Z} F{SPEED_Z}
            M400
        {% endif %}

        # 2. Posizionamento di sicurezza su X250 se non ci si trova giÃ 
        {% if current_x != SAFE_X %}
            M118 Sposto X a X:{SAFE_X} in sicurezza...
            G90
            G1 X{SAFE_X} F{SPEED_XY}
            M400
        {% endif %}
    {% endif %}


#################################################################################
# 2. SUBROUTINE FISICA DI DEPOSITO UTENSILE
#################################################################################
[gcode_macro _DEPOSITA_TOOL_FISICO]
description: Movimenti fisici per lo sgancio nel dock (richiede macchina homata)
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("ABORTITO: Tentativo di eseguire _DEPOSITA_TOOL_FISICO senza Homing (X/Y/Z)!") }
    {% else %}
        {% set F_NORMAL = 4800 %}
        {% set F_AGGANCIO = 2400 %}

        {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}
        {% set grab = [
            printer["gcode_button extruder_grab1"].state,
            printer["gcode_button extruder_grab2"].state,
            printer["gcode_button extruder_grab3"].state,
            printer["gcode_button extruder_grab4"].state
        ] %}
        {% set ns = namespace(mounted=[]) %}
        {% for i in range(4) %}
            {% if grab[i] == "PRESSED" %}
                {% set _ = ns.mounted.append(i+1) %}
            {% endif %}
        {% endfor %}

        {% if ns.mounted|length == 0 %}
            M118 Nessun tool da depositare.
        {% elif ns.mounted|length > 1 %}
            { action_raise_error("ABORTITO: piu di un sensore grab PRESSED contemporaneamente") }
        {% else %}
            {% set TOOL = ns.mounted[0] %}

            _SAFE_Z_HOP MIN_Z=10

            M118 Deposito fisico Tool {TOOL} in corso...
            G90
            G1 Y{y_map[TOOL]} F{F_NORMAL}
            M400
            M118 Avvicinamento lento a X295...
            G1 X295 F{F_AGGANCIO}
            M400

            STEPPER_UNLOCK
            M400

            G1 X250 F{F_NORMAL}
            M400
            M118 Tool {TOOL} depositato con successo.
        {% endif %}
    {% endif %}

#################################################################################
# 3. MACRO PUBBLICA DI DEPOSITO UTENSILE
#################################################################################

[gcode_macro DEPOSITA_TOOL]
description: Deposita l utensile attualmente montato (esegue G28 se non homata)
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        M118 Macchina non homata (X/Y/Z): avvio G28...
        G28
    {% else %}
        M118 Macchina homata: eseguo deposito diretto...
        _DEPOSITA_TOOL_FISICO
    {% endif %}

#################################################################################
# 4. SUBROUTINE FISICA DI PRELIEVO UTENSILE
#################################################################################

[gcode_macro _PRELEVA_TOOL_FISICO]
description: Movimenti fisici di prelievo tool (richiede macchina homata)
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("ABORTITO: Tentativo di eseguire _PRELEVA_TOOL_FISICO senza Homing (X/Y/Z)!") }
    {% else %}
        {% set F_NORMAL = 4800 %}
        {% set F_AGGANCIO = 2400 %}

        {% set TOOL = params.T|default(0)|int %}
        {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}

        {% if TOOL not in y_map %}
            { action_raise_error("ABORTITO: Tool non valido in _PRELEVA_TOOL_FISICO") }
        {% else %}
            _SAFE_Z_HOP MIN_Z=10

            M118 Prelievo Tool {TOOL} in corso...
            G90
            G1 Y{y_map[TOOL]} F{F_NORMAL}
            M400
            M118 Avvicinamento lento a X295...
            G1 X295 F{F_AGGANCIO}
            M400
            MOTOR_GRAB
            M400
            MOTOR_GRAB2
            M400
            G1 X250 F{F_NORMAL}
            M400
            M118 Tool {TOOL} agganciato.
        {% endif %}

    {% endif %}

#################################################################################
# 5. MACRO PUBBLICA DI PRELIEVO UTENSILE
#################################################################################

[gcode_macro PRELEVA_TOOL]
description: Preleva il tool N, depositando prima l eventuale tool gia montato se diverso
gcode:
    {% set TOOL = params.T|default(0)|int %}
    {% set y_map = {1: 55.813, 2: 105.096, 3: 155.597, 4: 205.296} %}

    {% if TOOL not in y_map %}
        { action_raise_error("ABORTITO: numero tool non valido o parametro T mancante (usa T=1, T=2, T=3 o T=4)") }
    {% else %}
        {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
            M118 Macchina non homata (X/Y/Z): avvio G28 e imposto TARGET={TOOL}...
            G28 TARGET={TOOL}
        {% else %}
            {% set grab = [
                printer["gcode_button extruder_grab1"].state,
                printer["gcode_button extruder_grab2"].state,
                printer["gcode_button extruder_grab3"].state,
                printer["gcode_button extruder_grab4"].state
            ] %}
            {% set ns = namespace(mounted=[]) %}
            {% for i in range(4) %}
                {% if grab[i] == "PRESSED" %}
                    {% set _ = ns.mounted.append(i+1) %}
                {% endif %}
            {% endfor %}

            {% if ns.mounted|length > 1 %}
                { action_raise_error("ABORTITO: piu di un sensore grab PRESSED contemporaneamente, stato anomalo") }
            {% elif ns.mounted|length == 1 and ns.mounted[0] == TOOL %}
                M118 Tool {TOOL} e gia montato, nessuna azione necessaria.
            {% else %}
                {% if ns.mounted|length == 1 %}
                    M118 Tool {ns.mounted[0]} montato, deposito prima di prelevare Tool {TOOL}...
                    _DEPOSITA_TOOL_FISICO
                {% endif %}

                _PRELEVA_TOOL_FISICO T={TOOL}
            {% endif %}
        {% endif %}
    {% endif %}

#################################################################################
[gcode_macro LOAD_FILAMENT]
description: Ciclo completo con controlli di sicurezza homing e presenza/cambio tool.
gcode:
    {% set TOOL_HUMAN = params.T|default(1)|int %}

    {% set PURGE_LENGTH = 100.0 %}
    {% set PURGE_FEEDRATE = 300 %}
    {% set RETRACT_LENGTH = -5.0 %}
    {% set RETRACT_FEEDRATE = 240 %}

    {% set TEMP_PURGE = 240 %}

    {% set X_SPURGO = 273.000 %}
    {% set Y_SPURGO = 255.000 %}

    {% set SPEED_XY = 4800 %}
    {% set SPEED_Z = 600 %}

    {% if TOOL_HUMAN < 1 or TOOL_HUMAN > 4 %}
        { action_raise_error("ABORTITO: Numero tool non valido! Usa T=1, T=2, T=3 o T=4.") }
    {% else %}
        {% set TOOL = TOOL_HUMAN - 1 %}

        # 1. PRELIEVO TOOL (Gestisce homing e deposito eventuale tool gia montato)
        PRELEVA_TOOL T={TOOL_HUMAN}

        # 2. RISCALDAMENTO E SPURGO
        M118 Riscaldamento Tool {TOOL_HUMAN} a {TEMP_PURGE}C per spurgo...
        M104 S{TEMP_PURGE} T{TOOL}

        M118 Posizionamento in sicurezza alle coordinate di spurgo...
        _SAFE_Z_HOP MIN_Z=10

        G1 Y{Y_SPURGO} F{SPEED_XY}
        G1 X{X_SPURGO} F{SPEED_XY}
        M400

        M109 S{TEMP_PURGE} T{TOOL}
        M118 Eseguisco spurgo di {PURGE_LENGTH} mm...
        G92 E0
        G1 E{PURGE_LENGTH} F{PURGE_FEEDRATE}
        M400

        M118 Eseguo ritrazione di {RETRACT_LENGTH} mm...
        G92 E0
        G1 E{RETRACT_LENGTH} F{RETRACT_FEEDRATE}
        M400

        # 3. PULIZIA UGELLO
        M118 Pulizia ugello...
        CLEAN_NOZZLE
        M118 Ciclo LOAD_FILAMENT completato con successo!
    {% endif %}



#################################################################################

[gcode_macro CLEAN_NOZZLE]
description: Pulisce l'ugello. Home -> Preleva -> Controllo temp (scalda a 240 se freddo) -> Pulizia.
gcode:
    {% set START_Z_LIFT = 10.0 %}
    {% set STAGING_X = 250.0 %}
    {% set STAGING_Y = 0.0 %}
    {% set CLEAN_Z = 3.0 %}
    {% set X_LEFT = 263.0 %}
    {% set X_RIGHT = 270.0 %}
    {% set SPEED_Z = 600 %}
    {% set SPEED_MOVE = 4800 %}
    {% set SPEED_CLEAN = 2400 %}
    {% set MIN_CLEAN_TEMP = 140.0 %}
    {% set TARGET_CLEAN_TEMP = 240.0 %}

    {% set X_SILICONE = 266.500 %}
    {% set Y_SILICONE = 13.800 %}
    {% set Z_SILICONE = 0.969 %}
    {% set TEMP_SAFE = 140 %}
    {% set SPEED_XY = 4800 %}

    # 1. VERIFICA SENSORI PRESENZA TOOL SUL CARRELLO
    {% set grab = [
        printer["gcode_button extruder_grab1"].state,
        printer["gcode_button extruder_grab2"].state,
        printer["gcode_button extruder_grab3"].state,
        printer["gcode_button extruder_grab4"].state
    ] %}
    {% set ns = namespace(mounted=[]) %}
    {% for i in range(4) %}
        {% if grab[i] == "PRESSED" %}
            {% set _ = ns.mounted.append(i+1) %}
        {% endif %}
    {% endfor %}

    # 2. DETERMINAZIONE TOOL RICHIESTO E GESTIONE SCOPE JINJA
    {% set req_t = params.T|default(0)|int %}
    {% if req_t == 0 and ns.mounted|length > 0 %}
        {% set TOOL_HUMAN = ns.mounted[0] %}
    {% else %}
        {% set TOOL_HUMAN = req_t %}
    {% endif %}

    # 3. VERIFICA HOMING
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        M118 Macchina non homata: avvio G28...
        {% if TOOL_HUMAN > 0 %}
            G28 TARGET={TOOL_HUMAN}
        {% else %}
            G28
        {% endif %}
    {% endif %}

    # 4. GESTIONE CARRELLO E PRELIEVO TOOL
    {% if ns.mounted | length > 1 %}
        { action_raise_error("ABORTITO: Piu di un sensore grab PRESSED contemporaneamente!") }
    {% elif ns.mounted | length == 0 %}
        {% if TOOL_HUMAN > 0 %}
            M118 Carrello vuoto. Prelevo automaticamente il Tool {TOOL_HUMAN} per la pulizia...
            PRELEVA_TOOL T={TOOL_HUMAN}
        {% else %}
            { action_raise_error("ABORTITO: Nessun tool montato e nessun tool specificato (usa CLEAN_NOZZLE T=1).") }
        {% endif %}
    {% else %}
        {% set current_mounted = ns.mounted[0] %}
        {% if TOOL_HUMAN > 0 and TOOL_HUMAN != current_mounted %}
            M118 Richiesto Tool {TOOL_HUMAN} ma e montato T{current_mounted}. Eseguo il cambio...
            PRELEVA_TOOL T={TOOL_HUMAN}
        {% else %}
            M118 Tool {current_mounted} gia pronto sul carrello. Procedo con la pulizia...
        {% endif %}
    {% endif %}

    # 5. MAPPATURA INDICI E NOMI ESTRUSORI KLIPPER
    # TOOL_HUMAN = 1 -> TOOL_INDEX = 0 -> current_extruder = "extruder"
    # TOOL_HUMAN = 2 -> TOOL_INDEX = 1 -> current_extruder = "extruder1"
    {% set TOOL_INDEX = TOOL_HUMAN - 1 %}
    {% set current_extruder = "extruder" if TOOL_INDEX == 0 else "extruder" ~ TOOL_INDEX %}
    {% set current_temp = printer[current_extruder].temperature|float %}

    # 6. CONTROLLO TEMPERATURA
    {% if current_temp < MIN_CLEAN_TEMP %}
        M118 Tool {TOOL_HUMAN} freddo ({current_temp}C < {MIN_CLEAN_TEMP}C). Riscaldo a {TARGET_CLEAN_TEMP}C...
        M109 S{TARGET_CLEAN_TEMP} T{TOOL_INDEX}
    {% else %}
        M118 Temperatura Tool {TOOL_HUMAN} OK ({current_temp}C). Procedo direttamente.
    {% endif %}

    # 7. ESECUZIONE PULIZIA
    _SAFE_Z_HOP MIN_Z={START_Z_LIFT}

    G90
    G1 X{STAGING_X} F{SPEED_MOVE}
    G1 Y{STAGING_Y} F{SPEED_MOVE}
    G1 X{X_RIGHT} F{SPEED_MOVE}
    M400

    G1 Z{CLEAN_Z} F{SPEED_Z}
    M400

    {% for i in range(3) %}
        G1 X{X_LEFT} F{SPEED_CLEAN}
        G1 X{X_RIGHT} F{SPEED_CLEAN}
    {% endfor %}
    G1 X{X_LEFT} F{SPEED_CLEAN}
    M400

    # 8. RAFFREDDAMENTO SU SILICONE
    M118 Spengo riscaldatore Tool {TOOL_HUMAN}...
    SET_HEATER_TEMPERATURE HEATER={current_extruder} TARGET=0

    _SAFE_Z_HOP MIN_Z=10

    M118 Sposto sul cuscinetto di raffreddamento...
    G1 Y{Y_SILICONE} F{SPEED_XY}
    G1 X{X_SILICONE} F{SPEED_XY}

    M118 Discesa sul silicone a quota Z={Z_SILICONE} mm...
    G1 Z{Z_SILICONE} F{SPEED_Z}
    M400

    M118 Attendo raffreddamento a {TEMP_SAFE}C...
    TEMPERATURE_WAIT SENSOR={current_extruder} MAXIMUM={TEMP_SAFE|float}

    # 9. DISIMPEGNO E DEPOSITO
    _SAFE_Z_HOP MIN_Z=10

    M118 Deposito il Tool {TOOL_HUMAN}...
    DEPOSITA_TOOL

    M118 Pulizia ugello completata.
#################################################################################

[gcode_macro DISABILITA_MOTORI]
description: Spegne la coppia dei motori stepper per muoverli a mano
gcode:
    M400
    M84
    M118 Motori disabilitati. Carrello libero.

#################################################################################

[gcode_macro SBLOCCA_XY]
description: Disabilita solo i motori X e Y mantenendo Z bloccato
gcode:
    M400
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    M118 Assi X e Y sbloccati.

#################################################################################

[gcode_shell_command REBOOT_HOST]
command: /usr/data/home/pwned/reboot.sh
timeout: 5
verbose: True

[gcode_macro REBOOT_PRINTER]
variable_value: 0
gcode:
    RUN_SHELL_COMMAND CMD=REBOOT_HOST

#################################################################################

[gcode_shell_command REBOOT_HOST_CMD]
command: /usr/data/home/pwned/host_reboot.sh
timeout: 2
verbose: True

[gcode_macro SAVE_AND_REBOOT]
gcode:
    SAVE_CONFIG
    RUN_SHELL_COMMAND CMD=REBOOT_HOST_CMD

#################################################################################

[gcode_shell_command RESTART_KLIPPER_SHELL]
command: /bin/sh -c "/usr/prog/klipper/klipperDaemon restart >/dev/null 2>&1 &"
timeout: 5
verbose: False

[gcode_shell_command RESTART_MOONRAKER_SHELL]
command: /bin/sh -c "/usr/prog/klipper/moonrakerDaemon restart >/dev/null 2>&1 &"
timeout: 5
verbose: False

#################################################################################

[delayed_gcode LED_AUTO_ON]
initial_duration: 10.0
gcode:
    SET_LED LED=chamber_led WHITE=0.5

[gcode_macro RIAVVIA_MOONRAKER]
variable_value: 0
description: Riavvia il servizio Moonraker
gcode:
    RUN_SHELL_COMMAND CMD=RESTART_MOONRAKER_SHELL

[gcode_macro RIAVVIA_KLIPPER]
variable_value: 0
description: Riavvia il servizio Klipper
gcode:
    RUN_SHELL_COMMAND CMD=RESTART_KLIPPER_SHELL



#########################################################################################################################################################################################à

###############################################################################################################################################################
### needed: gshell command installed:                                                                                                                       ###
### wget -O /usr/prog/klipper/klippy/extras/gcode_shell_command.py https://raw.githubusercontent.com/dw-0/kiauh/master/resources/gcode_shell_command.py     ###
### on esphome device with a switch named: interruttore!!!                                                                                                  ###
### add in your "END_PRINT" macro or END_PRINT slicer gcodes thes line:                                                                                     ###
                                                                                                                                                            ###
### UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10                                                                               ###
###                                 AND                                                                                                                     ###
### in START_PRINT slicer gcoeds reset timer of delayed cacro:                                                                                              ###
### UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=0                                                                                ###
###############################################################################################################################################################

[gcode_shell_command shutdown_printer]
command: /opt/bin/curl -s -X POST http://192.168.1.89/switch/interruttore/turn_off
timeout: 5
verbose: True

[delayed_gcode ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO]
gcode:
    {% set e0 = printer['extruder'].temperature %}
    {% set e1 = printer['extruder1'].temperature %}
    {% set e2 = printer['extruder2'].temperature %}
    {% set e3 = printer['extruder3'].temperature %}
    {% if e0 <= 45 and e1 <= 45 and e2 <= 45 and e3 <= 45 %}
        RUN_SHELL_COMMAND CMD=shutdown_printer
        RESPOND MSG="Tutti gli hotend sotto 45C, spegnimento inviato"
    {% else %}
        RESPOND MSG="Attesa raffreddamento: E0={e0}C E1={e1}C E2={e2}C E3={e3}C"
        UPDATE_DELAYED_GCODE ID=ATTESA_RAFFREDDAMENTO_PER_SPEGNIMENTO DURATION=10
    {% endif %}
###############################################################################################################################################################
